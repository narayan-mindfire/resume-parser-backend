services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: resume-parser-backend:latest
    ports:
      - "5003:5003"
    env_file:
      - .env
    depends_on:
      - redis-stack
      - postgres
      - minio

  worker:
    build:
      context: .
      dockerfile: Worker.Dockerfile
    image: resume-parser-worker:latest
    env_file:
      - .env
    depends_on:
      - redis-stack
      - postgres
      - minio

  minio:
    image: minio/minio
    container_name: minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio123
    volumes:
      - ./minio-data:/data
    command: server /data --console-address ":9001"

  redis-stack:
    image: redis/redis-stack:latest
    container_name: redis-stack
    ports:
      - "6379:6379"
      - "8001:8001"
    volumes:
      - redis-data:/data

  tesseract:
    image: jitesoft/tesseract-ocr
    container_name: tesseract_ocr
    stdin_open: true
    tty: true
    volumes:
      - ./data:/data
    working_dir: /data

  postgres:
    image: postgres:15
    container_name: postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: resume_parser
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres123
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: unless-stopped

  pgadmin:
    image: dpage/pgadmin4
    container_name: pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - postgres

volumes:
  redis-data:
  postgres-data:
  minio-data:
