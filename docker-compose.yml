services:
  minio:
    image: minio/minio
    container_name: minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio123
    volumes:
      - ./minio-data:/data
    command: server /data --console-address ":9001"

  redis-stack:
    image: redis/redis-stack:latest
    container_name: redis-stack
    ports:
      - "6379:6379"
      - "8001:8001"
    volumes:
      - redis-data:/data

  tesseract:
    image: jitesoft/tesseract-ocr
    container_name: tesseract_ocr
    stdin_open: true
    tty: true
    volumes:
      - ./data:/data
    working_dir: /data

volumes:
  redis-data:
